name: besir
options:
  bundleIdPrefix: com.iseongmin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: besir
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  besir-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - Resources
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: besir
        NSLocationWhenInUseUsageDescription: "현재 위치를 기준으로 출발 시각을 계산하기 위해 위치 정보를 사용합니다."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 앱이 포그라운드에 없을 때도 구글 캘린더와 동기화하기 위한 백그라운드 실행 권한.
        # 실행 시점은 iOS가 정하며(BGTaskScheduler), 아래 식별자는 App.swift의
        # BackgroundSync.taskIdentifier와 반드시 같아야 등록된다.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.iseongmin.besir.sync
    entitlements:
      path: Generated/besir-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iseongmin.besir
    dependencies:
      - target: besirShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iseongmin.besir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 자동 서명 + 본인 Apple ID 팀(xcodegen 재생성 시에도 유지).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DFEME8ZQT9

  besirShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared/SharedInbox.swift
    info:
      path: Generated/Info-ShareExtension.plist
      properties:
        CFBundleDisplayName: besir
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Generated/besirShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iseongmin.besir
    settings:
      base:
        # 최상위 PRODUCT_NAME(besir)을 그대로 쓰면 메인 앱과 모듈명이 겹쳐 빌드 충돌 발생 → 반드시 재정의.
        PRODUCT_NAME: besirShare
        PRODUCT_BUNDLE_IDENTIFIER: com.iseongmin.besir.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DFEME8ZQT9

  besir-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - Resources
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: besir
        LSMinimumSystemVersion: "14.0"
        NSLocationUsageDescription: "현재 위치를 기준으로 출발 시각을 계산하기 위해 위치 정보를 사용합니다."
        NSLocationWhenInUseUsageDescription: "현재 위치를 기준으로 출발 시각을 계산하기 위해 위치 정보를 사용합니다."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/besir-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iseongmin.besir
        # ad-hoc("-")는 빌드마다 서명 정체성이 바뀌어 키체인(구글 로그인 토큰) 접근이 끊김.
        # 실제 팀으로 서명해 정체성을 고정(Xcode Signing&Capabilities에서 확인된 팀 ID. xcodegen 재생성 시 리셋되지 않도록 여기 고정).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y54D2W4F4T
